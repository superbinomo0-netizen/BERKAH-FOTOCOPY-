<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir POS - BERKAH FOTOCOPY</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090E8A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        royal: {
                            800: '#0D14A3',
                            900: '#090E8A',
                            950: '#05085C',
                        },
                        skyaccent: {
                            400: '#62B6F6',
                            500: '#3B9EEB',
                        }
                    },
                    boxShadow: {
                        'soft-card': '0 10px 28px -6px rgba(9, 14, 138, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04)',
                        'floating-orb': '0 10px 25px -4px rgba(59, 158, 235, 0.55)',
                        'iphone-glass': '0 8px 32px 0 rgba(9, 14, 138, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Efek Kaca iPhone (Glassmorphism / Frosted Glass) */
        .iphone-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .iphone-glass-dark {
            background: rgba(9, 14, 138, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .iphone-glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Diagonal geometric background */
        .royal-hero-bg {
            background-color: #090E8A;
            background-image: linear-gradient(125deg, #05085C 0%, #090E8A 52%, #131CB8 52.3%, #0D14A3 100%);
        }

        /* Print Styling */
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            @page {
                margin: 5mm;
            }
        }

        .fade-in {
            animation: fadeIn 0.22s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#F4F7FC] text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- Area Khusus Print -->
    <div id="print-area" class="hidden print:block"></div>

    <!-- ===================================================================== -->
    <!-- HERO HEADER DENGAN EFEK KACA iPHONE                                    -->
    <!-- ===================================================================== -->
    <header class="royal-hero-bg text-white pt-4 pb-14 sm:pb-16 relative overflow-hidden no-print">
        <div class="pointer-events-none absolute -right-12 -top-12 w-56 h-56 rounded-full bg-white/[0.04]"></div>
        <div class="pointer-events-none absolute left-1/3 bottom-0 w-72 h-32 bg-skyaccent-400/[0.06] -skew-x-12"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <!-- Baris Atas: Menu Kiri & Avatar Profil Kanan -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <button type="button" onclick="openQuickMenuModal()" class="w-10 h-10 rounded-2xl iphone-glass-dark hover:bg-white/30 border border-white/20 flex items-center justify-center transition-all active:scale-95 shadow-sm" title="Menu Cepat">
                        <i data-lucide="align-left" class="w-5 h-5 text-white"></i>
                    </button>
                    <div class="hidden sm:flex items-center gap-2 iphone-glass-dark border border-white/20 px-3.5 py-1.5 rounded-full text-xs font-medium text-indigo-100">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="live-date"></span>
                        <span class="opacity-50">•</span>
                        <span id="live-clock" class="font-mono font-bold text-white"></span>
                    </div>
                </div>

                <!-- Kanan: Jam Mobile + Badge Profil Admin Kasir -->
                <div class="flex items-center gap-2.5">
                    <span id="live-clock-mobile" class="sm:hidden text-xs font-mono font-bold iphone-glass-dark border border-white/20 px-2.5 py-1.5 rounded-xl text-indigo-100"></span>
                    <button type="button" onclick="openAdminProfileModal()" class="flex items-center gap-2.5 iphone-glass-dark hover:bg-white/30 border border-white/25 pl-3 pr-1.5 py-1 rounded-full transition-all group shadow-sm" title="Edit Profil Admin">
                        <div class="text-right hidden xs:block sm:block">
                            <div id="header-admin-name-desktop" class="text-xs font-bold text-white leading-tight max-w-[120px] truncate">Admin Kasir</div>
                            <div id="header-admin-role-desktop" class="text-[10px] text-indigo-200 leading-tight max-w-[120px] truncate">Kasir Utama</div>
                        </div>
                        <div id="header-avatar-desktop" class="w-9 h-9 rounded-full bg-amber-300 text-royal-900 font-extrabold text-xs flex items-center justify-center overflow-hidden shrink-0 ring-2 ring-white/80 shadow-sm group-hover:scale-105 transition-transform">
                            AK
                        </div>
                    </button>
                </div>
            </div>

            <!-- Judul Toko & Omzet Hari Ini dengan Tab Efek Kaca iPhone -->
            <div class="mt-5 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <div>
                    <div class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-skyaccent-400 mb-1">
                        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                        <span>Aplikasi Kasir POS</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white leading-tight">
                        BERKAH FOTOCOPY
                    </h1>
                    <p class="text-xs sm:text-sm text-indigo-200 flex items-center gap-1.5 mt-1">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-skyaccent-400 shrink-0"></i>
                        <span>JL. Serang, pertigaan pasar gorda</span>
                    </p>
                </div>

                <!-- Tab Omzet Hari Ini dengan Efek Kaca iPhone -->
                <div class="flex items-center gap-2.5 self-start sm:self-end">
                    <button type="button" onclick="switchTab('laporan')" class="iphone-glass-dark hover:bg-white/25 border border-white/25 px-4 py-2.5 rounded-2xl text-left transition-all shadow-lg">
                        <div class="text-[10px] uppercase tracking-wider text-indigo-200 font-bold">Omzet Hari Ini</div>
                        <div id="header-today-omzet" class="text-base sm:text-lg font-extrabold text-white mt-0.5">Rp 0</div>
                    </button>
                    <button type="button" onclick="openAdminProfileModal()" class="sm:hidden iphone-glass-dark border border-white/25 px-3 py-2.5 rounded-2xl text-left">
                        <div class="text-[10px] uppercase tracking-wider text-indigo-200 font-bold">Kasir</div>
                        <div id="header-admin-name-mobile" class="text-xs font-extrabold text-white mt-0.5 max-w-[90px] truncate">Admin Kasir</div>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ===================================================================== -->
    <!-- KONTEN UTAMA DENGAN SHEET PUTIH MELENGKUNG                           -->
    <!-- ===================================================================== -->
    <main class="flex-1 bg-[#F4F7FC] rounded-t-[32px] sm:rounded-t-[40px] -mt-8 relative z-20 shadow-[0_-10px_35px_rgba(9,14,138,0.14)] pt-6 sm:pt-8 pb-32 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- ========================================== -->
            <!-- TAB 1: KASIR / TRANSAKSI                   -->
            <!-- ========================================== -->
            <section id="view-kasir" class="fade-in">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    
                    <!-- Kolom Kiri: Katalog Produk & Jasa -->
                    <div class="lg:col-span-7 xl:col-span-8 flex flex-col gap-4">
                        <!-- Search Bar Kapsul & Filter Kategori Efek Kaca -->
                        <div class="iphone-glass-card p-4 rounded-3xl shadow-soft-card border border-white/80 flex flex-col gap-3">
                            <div class="relative">
                                <i data-lucide="search" class="w-4 h-4 text-royal-900 absolute left-4 top-1/2 -translate-y-1/2"></i>
                                <input type="text" id="pos-search" oninput="renderPosProducts()" placeholder="Cari fotocopy, print, jilid, pulpen, kertas..." class="w-full pl-11 pr-10 py-3 bg-[#F4F7FC]/80 border border-slate-200/60 rounded-2xl text-sm font-medium text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-royal-900/20 focus:bg-white focus:border-royal-900/30 transition-all">
                                <button id="pos-search-clear" onclick="clearPosSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                            
                            <!-- Filter Kategori Pills -->
                            <div class="flex items-center gap-2 overflow-x-auto pb-1" id="pos-category-filters">
                                <!-- Diisi via JavaScript -->
                            </div>
                        </div>

                        <!-- Grid Produk -->
                        <div id="pos-product-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3.5">
                            <!-- Diisi via JavaScript -->
